<!-- ============================================================
     HERO · scroll-driven video scrubbing

<section id="inicio" class="cine" aria-label="Bajo Los Tres Palos MX, guantes de portero">
  <div class="cine-pin">
    <div class="cine-stage">
      <img class="cine-media cine-poster" src="assets/img/poster-1.jpg"
           alt="Par de guantes de portero blancos con detalles dorados y tricolor mexicano"
           width="1280" height="720">

      <video class="cine-media cine-clip" muted playsinline preload="auto" aria-hidden="true"
             poster="assets/img/poster-1.jpg"
             data-src-lg="assets/media/hero-1.mp4"
             data-src-sm="assets/media/hero-1-540.mp4"></video>

      <video class="cine-media cine-clip" muted playsinline preload="none" aria-hidden="true"
             poster="assets/img/poster-2.jpg"
             data-src-lg="assets/media/hero-2.mp4"
             data-src-sm="assets/media/hero-2-540.mp4"></video>

      <div class="cine-grain"></div>
      <div class="cine-scrim"></div>
    </div>

    <div class="cine-copy">
      <img class="cine-logo" src="assets/img/logo-btp.png"
           alt="Escudo de Bajo Los Tres Palos MX" width="640" height="611">
      <p class="mono cine-eyebrow">Guantes de portero · México</p>
      <h1 class="display cine-h1">El arco no se<br>defiende <em>a medias</em></h1>
      <p class="cine-sub">Guantes para el que se planta bajo los tres palos cada fin de semana. Cortes, látex y tallas explicados sin humo, para que compres el guante correcto a la primera.</p>
    </div>

    <div class="cine-hud mono">
      <span>BTP · MX</span>
      <span class="cine-hud-idx">000 %</span>
    </div>
    <div class="cine-prog"></div>
    <div class="cine-cue" aria-hidden="true">↓</div>
  </div>
